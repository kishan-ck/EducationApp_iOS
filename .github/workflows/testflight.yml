name: iOS TestFlight

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-upload:
    name: Build and Upload to TestFlight
    runs-on: macos-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install CocoaPods dependencies
        run: |
          gem install cocoapods --no-document
          pod install

      - name: Install certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/distribution.p12

          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          security create-keychain \
            -p "temporary" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "temporary" \
            "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          # Include both custom and login keychains so codesign can find the cert
          security list-keychains \
            -d user \
            -s "$KEYCHAIN_PATH" ~/Library/Keychains/login.keychain-db

          security default-keychain \
            -s "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision

          echo "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles

          cp "$PROFILE_PATH" \
            ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build and archive
        run: |
          xcodebuild \
            -workspace EducationApp.xcworkspace \
            -scheme EducationApp \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $RUNNER_TEMP/EducationApp.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="Education AppStore Distribution" \
            clean archive

      - name: Export IPA
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath $RUNNER_TEMP/EducationApp.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath $RUNNER_TEMP/export

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p $RUNNER_TEMP/private_keys

          echo "$APP_STORE_CONNECT_PRIVATE_KEY" \
            > $RUNNER_TEMP/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8

          xcrun altool \
            --upload-app \
            --type ios \
            --file $RUNNER_TEMP/export/EducationApp.ipa \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --private-key @file:$RUNNER_TEMP/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8

      - name: Cleanup
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
          rm -rf ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision
          rm -f $RUNNER_TEMP/private_keys/AuthKey_*.p8
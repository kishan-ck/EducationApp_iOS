name: iOS TestFlight Deploy (Swift - No Fastlane)

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # 🔐 Setup App Store API Key
      - name: Setup API Key
        run: |
          mkdir -p private_keys
          echo "${{ secrets.APPSTORE_API_PRIVATE_KEY }}" > private_keys/AuthKey.p8

      # 🔢 Increment Build Number
      - name: Increment Build Number
        run: |
          agvtool next-version -all || true

      # 🏗 Build Archive
      - name: Build Archive
        run: |
          xcodebuild \
          -scheme EducationApp \
          -configuration Release \
          -archivePath $PWD/build/EducationApp.xcarchive \
          archive \
          DEVELOPMENT_TEAM=YOUR_TEAM_ID

      # 📦 Export IPA
      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
          -archivePath $PWD/build/EducationApp.xcarchive \
          -exportOptionsPlist exportOptions.plist \
          -exportPath $PWD/build

      # 🚀 Upload to TestFlight
      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app \
          -f build/EducationApp.ipa \
          -t ios \
          --apiKey ${{ secrets.APPSTORE_API_KEY_ID }} \
          --apiIssuer ${{ secrets.APPSTORE_ISSUER_ID }}
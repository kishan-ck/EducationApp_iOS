name: iOS TestFlight Deploy (Manual Signing - Stable)

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # 🔐 Install Certificate
      - name: Install Certificate
        run: |
          echo "${{ secrets.P12_BASE64 }}" | base64 --decode > certificate.p12
          security create-keychain -p "" build.keychain
          security import certificate.p12 -k build.keychain -P "${{ secrets.P12_PASSWORD }}" -T /usr/bin/codesign
          security list-keychains -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain

      # 🔐 Install Provisioning Profile
      - name: Install Provisioning Profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.PROVISION_PROFILE_BASE64 }}" | base64 --decode > profile.mobileprovision
          UUID=$(grep -a -E -o "[-A-F0-9]{36}" profile.mobileprovision | head -1)
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision

      # 🔐 Setup App Store API Key
      - name: Setup API Key
        run: |
          mkdir -p private_keys
          echo "${{ secrets.APPSTORE_API_PRIVATE_KEY }}" > private_keys/AuthKey_${{ secrets.APPSTORE_API_KEY_ID }}.p8

      # 🔢 Increment Build Number
      - name: Increment Build Number
        run: |
          agvtool next-version -all || true

      # 🏗 Build Archive (Manual Signing)
      - name: Build Archive
        run: |
          xcodebuild \
          -scheme EducationApp \
          -configuration Release \
          -archivePath $PWD/build/EducationApp.xcarchive \
          -destination 'generic/platform=iOS' \
          CODE_SIGN_STYLE=Manual \
          DEVELOPMENT_TEAM=95L29MZABL \
          PROVISIONING_PROFILE_SPECIFIER="CKLearnProfile" \
          archive

      # 📦 Export IPA
      - name: Export IPA
        run: |
          cat <<EOF > exportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>95L29MZABL</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>compileBitcode</key>
              <false/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
          -archivePath $PWD/build/EducationApp.xcarchive \
          -exportOptionsPlist exportOptions.plist \
          -exportPath $PWD/build

      # 🚀 Upload to TestFlight
      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app \
          -f build/*.ipa \
          -t ios \
          --apiKey ${{ secrets.APPSTORE_API_KEY_ID }} \
          --apiIssuer ${{ secrets.APPSTORE_ISSUER_ID }}